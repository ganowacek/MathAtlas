<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Atlas</title>
    <meta
      name="description"
      content="An interactive atlas of mathematical fields, topics, people, works, history, applications, and relationships."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('math-atlas-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Injected at runtime so Vite's HTML asset pipeline doesn't touch
      // (and drop) this external stylesheet link during the build.
      (function () {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href =
          'https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap';
        document.head.appendChild(link);
      })();
    </script>
    <style>
      :root {
        --font-geist-sans: 'Geist', Arial, sans-serif;
        --font-geist-mono: 'Geist Mono', monospace;
      }
      html, body, #root { height: 100%; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
